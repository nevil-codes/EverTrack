[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tk callbacks and widget construction read better with the app's own style
"tabs/*.py" = ["E402"]
# FastAPI's Depends()/Query() in parameter defaults is the framework's own idiom
"api/**/*.py" = ["B008"]
