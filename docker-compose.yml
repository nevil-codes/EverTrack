services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evertrack
      POSTGRES_PASSWORD: evertrack
      POSTGRES_DB: evertrack
    ports:
      - "5432:5432"
    volumes:
      - evertrack-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evertrack -d evertrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the SQL migrations, then exits. The API waits for it to succeed.
  migrate:
    build: .
    command: ["python", "scripts/migrate_postgres.py"]
    environment:
      EVERTRACK_DATABASE_URL: postgresql://evertrack:evertrack@db:5432/evertrack
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      EVERTRACK_DATABASE_URL: postgresql://evertrack:evertrack@db:5432/evertrack
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  evertrack-data:
