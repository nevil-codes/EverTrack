name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Import the GUI modules headlessly
        # Catches import-time breakage in the Tk layer without needing a display
        run: xvfb-run -a python -c "import main"

      - name: Smoke test the API
        run: |
          python scripts/seed_demo_data.py --database ci.db
          uvicorn api.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/habits | head -c 200
          curl -sf localhost:8000/stats/streak
        env:
          EVERTRACK_DB: ci.db
